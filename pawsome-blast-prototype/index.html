<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFE8F0" />
<title>Pawsome Blast — Prototype</title>
<style>
  :root {
    --bg: #FFF4F8;
    --panel: #FFFFFF;
    --ink: #2C2641;
    --muted: #7A7398;
    --accent: #FF7BA9;
    --accent-2: #6EC5FF;
    --grid: #F1E9F5;
    --grid-stroke: #E3D8EC;
    --cage: #B89BD9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Nunito, system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px 6px;
  }
  .brand {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.2px;
  }
  .brand .paw { color: var(--accent); }
  .stat {
    display: flex; gap: 10px;
  }
  .chip {
    background: var(--panel);
    border-radius: 14px;
    padding: 6px 10px;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 0 rgba(44,38,65,0.08);
    display: flex; align-items: center; gap: 6px;
  }
  .chip .lbl { color: var(--muted); font-weight: 600; }
  #board-wrap {
    width: 100%;
    max-width: 480px;
    padding: 10px;
    background: var(--panel);
    border-radius: 18px;
    box-shadow: 0 4px 0 rgba(44,38,65,0.08);
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 3px;
    aspect-ratio: 1 / 1;
    background: var(--grid-stroke);
    border-radius: 12px;
    padding: 4px;
  }
  .cell {
    background: var(--grid);
    border-radius: 6px;
    position: relative;
    transition: background 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 0;
  }
  .cell.filled {
    font-size: 22px;
    animation: pop 0.18s ease-out;
  }
  .cell.cage::after {
    content: "🔒";
    position: absolute;
    font-size: 14px;
    opacity: 0.7;
  }
  .cell.hint {
    background: #FFD7E6;
  }
  .cell.invalid {
    background: #FFC4C4;
  }
  @keyframes pop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .cell.clearing {
    animation: clear 0.3s ease-out forwards;
  }
  @keyframes clear {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  #tray-wrap {
    width: 100%;
    max-width: 480px;
    margin-top: 12px;
    padding: 14px 10px;
    background: var(--panel);
    border-radius: 18px;
    box-shadow: 0 4px 0 rgba(44,38,65,0.08);
  }
  #tray {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    min-height: 100px;
  }
  .tray-slot {
    display: flex; align-items: center; justify-content: center;
    min-height: 100px;
    border-radius: 12px;
    background: var(--grid);
    position: relative;
    touch-action: none;
  }
  .tray-slot.empty { opacity: 0.2; }
  .tray-slot.picked { opacity: 0.4; }
  .piece-mini {
    display: grid;
    gap: 2px;
  }
  .piece-mini .pc {
    width: 16px; height: 16px;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .piece-mini .pc.empty { background: transparent; }
  .piece-mini .pc.full {
    background: #FFD7E6;
  }
  #combo {
    position: fixed;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 42px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(255,123,169,0.5);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  #combo.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.2);
  }
  #drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    display: none;
    transform: translate(-50%, -110%);
  }
  #drag-ghost.active { display: block; }
  .ghost-grid {
    display: grid;
    gap: 3px;
  }
  .ghost-grid .gp {
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: transparent;
  }
  .ghost-grid .gp.full {
    background: rgba(255, 123, 169, 0.7);
  }
  footer {
    margin-top: 14px;
    width: 100%;
    max-width: 480px;
    display: flex; gap: 8px;
    padding-bottom: 8px;
  }
  button {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 14px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 3px 0 #E5649A;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary {
    background: var(--accent-2);
    box-shadow: 0 3px 0 #4FA5DD;
  }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 #E5649A; }
  button.secondary:active { box-shadow: 0 1px 0 #4FA5DD; }
  #modal {
    position: fixed; inset: 0;
    background: rgba(44,38,65,0.6);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #modal.show { display: flex; }
  .modal-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 24px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-card h2 { margin: 0 0 8px; color: var(--ink); }
  .modal-card p { margin: 6px 0 16px; color: var(--muted); }
  .big-animal { font-size: 64px; }
  .help-line {
    font-size: 12px; color: var(--muted);
    text-align: center; padding: 6px;
    max-width: 480px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="paw">🐾</span> Pawsome Blast</div>
    <div class="stat">
      <div class="chip"><span class="lbl">Puan</span><span id="score">0</span></div>
      <div class="chip"><span class="lbl">Kurtarılan</span><span id="rescued">0</span> 🐱</div>
    </div>
  </header>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="tray-wrap">
    <div id="tray">
      <div class="tray-slot" data-slot="0"></div>
      <div class="tray-slot" data-slot="1"></div>
      <div class="tray-slot" data-slot="2"></div>
    </div>
  </div>

  <footer>
    <button id="new-game">Yeni Oyun</button>
    <button class="secondary" id="cat-reroll">🐱 Reroll (3)</button>
  </footer>

  <div class="help-line">Parçayı bas-sürükle ile tahtaya bırak. Satır veya sütunu doldur, kafesi kır, hayvanı kurtar.</div>

  <div id="combo">COMBO!</div>
  <div id="drag-ghost"><div class="ghost-grid"></div></div>

  <div id="modal">
    <div class="modal-card">
      <div class="big-animal" id="modal-animal">🐱</div>
      <h2 id="modal-title">Oyun Bitti</h2>
      <p id="modal-text">Bir parça daha koyamıyorsun.</p>
      <button id="modal-btn">Tekrar Oyna</button>
    </div>
  </div>

<script>
(() => {
  const ROWS = 8, COLS = 8;
  const ANIMALS = ["🐱", "🐶", "🐰", "🐹"];
  const SHAPES = [
    { g: [[1]], name: "single" },
    { g: [[1,1]], name: "h2" },
    { g: [[1],[1]], name: "v2" },
    { g: [[1,1,1]], name: "h3" },
    { g: [[1],[1],[1]], name: "v3" },
    { g: [[1,1,1,1]], name: "h4" },
    { g: [[1],[1],[1],[1]], name: "v4" },
    { g: [[1,1],[1,1]], name: "box2" },
    { g: [[1,0],[1,1]], name: "L2a" },
    { g: [[0,1],[1,1]], name: "L2b" },
    { g: [[1,1],[1,0]], name: "L2c" },
    { g: [[1,1],[0,1]], name: "L2d" },
    { g: [[1,1,1],[0,1,0]], name: "T3" },
    { g: [[1,0],[1,0],[1,1]], name: "Ld" },
    { g: [[0,1],[0,1],[1,1]], name: "Le" },
    { g: [[1,1,1],[1,0,0]], name: "Lf" },
    { g: [[1,1,1],[0,0,1]], name: "Lg" },
  ];

  const state = {
    board: [],           // ROWS x COLS — null veya {a: emoji}
    cages: new Set(),    // "r,c" strings for cage cells
    tray: [null, null, null],
    score: 0,
    rescued: 0,
    reroll: 3,
    gameOver: false,
  };

  const el = {
    board: document.getElementById("board"),
    tray: document.getElementById("tray"),
    score: document.getElementById("score"),
    rescued: document.getElementById("rescued"),
    modal: document.getElementById("modal"),
    modalTitle: document.getElementById("modal-title"),
    modalText: document.getElementById("modal-text"),
    modalAnimal: document.getElementById("modal-animal"),
    modalBtn: document.getElementById("modal-btn"),
    combo: document.getElementById("combo"),
    ghost: document.getElementById("drag-ghost"),
    ghostGrid: document.querySelector("#drag-ghost .ghost-grid"),
    newGame: document.getElementById("new-game"),
    reroll: document.getElementById("cat-reroll"),
  };

  function initBoard() {
    state.board = Array.from({length: ROWS}, () =>
      Array.from({length: COLS}, () => null)
    );
    state.cages.clear();
    // 2 random cages
    const cageCount = 2;
    const placed = new Set();
    while (placed.size < cageCount) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      placed.add(`${r},${c}`);
    }
    for (const k of placed) state.cages.add(k);
    renderBoard();
  }

  function renderBoard() {
    el.board.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const d = document.createElement("div");
        d.className = "cell";
        d.dataset.r = r; d.dataset.c = c;
        const v = state.board[r][c];
        if (v) {
          d.classList.add("filled");
          d.textContent = v.a;
        }
        if (state.cages.has(`${r},${c}`)) d.classList.add("cage");
        el.board.appendChild(d);
      }
    }
  }

  function randomShape() {
    const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    return { g: s.g.map(row => row.slice()), name: s.name, a };
  }

  function fillTray() {
    for (let i = 0; i < 3; i++) {
      if (!state.tray[i]) state.tray[i] = randomShape();
    }
    renderTray();
  }

  function renderTray() {
    for (let i = 0; i < 3; i++) {
      const slot = el.tray.querySelector(`[data-slot="${i}"]`);
      slot.innerHTML = "";
      slot.classList.remove("empty", "picked");
      const p = state.tray[i];
      if (!p) { slot.classList.add("empty"); continue; }
      const mini = document.createElement("div");
      mini.className = "piece-mini";
      mini.style.gridTemplateColumns = `repeat(${p.g[0].length}, auto)`;
      for (let rr = 0; rr < p.g.length; rr++) {
        for (let cc = 0; cc < p.g[0].length; cc++) {
          const d = document.createElement("div");
          d.className = "pc " + (p.g[rr][cc] ? "full" : "empty");
          if (p.g[rr][cc]) d.textContent = p.a;
          mini.appendChild(d);
        }
      }
      slot.appendChild(mini);
    }
  }

  // Drag logic (unified pointer)
  let drag = null;

  el.tray.addEventListener("pointerdown", (e) => {
    const slot = e.target.closest(".tray-slot");
    if (!slot) return;
    const idx = parseInt(slot.dataset.slot, 10);
    const p = state.tray[idx];
    if (!p || state.gameOver) return;
    e.preventDefault();
    slot.setPointerCapture(e.pointerId);
    drag = {
      idx, piece: p, pointerId: e.pointerId,
      slotEl: slot,
      lastR: -1, lastC: -1,
    };
    slot.classList.add("picked");
    showGhost(p, e.clientX, e.clientY);
  });

  function showGhost(p, x, y) {
    el.ghost.classList.add("active");
    el.ghostGrid.style.gridTemplateColumns = `repeat(${p.g[0].length}, ${cellSize()}px)`;
    el.ghostGrid.style.gridAutoRows = `${cellSize()}px`;
    el.ghostGrid.innerHTML = "";
    for (let rr = 0; rr < p.g.length; rr++) {
      for (let cc = 0; cc < p.g[0].length; cc++) {
        const d = document.createElement("div");
        d.className = "gp " + (p.g[rr][cc] ? "full" : "");
        if (p.g[rr][cc]) d.textContent = p.a;
        el.ghostGrid.appendChild(d);
      }
    }
    moveGhost(x, y);
  }

  function moveGhost(x, y) {
    el.ghost.style.left = x + "px";
    el.ghost.style.top = y + "px";
  }

  function cellSize() {
    const c = el.board.querySelector(".cell");
    return c ? c.getBoundingClientRect().width : 36;
  }

  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    moveGhost(e.clientX, e.clientY);
    updateHint(e.clientX, e.clientY);
  });

  function clearHints() {
    el.board.querySelectorAll(".hint, .invalid").forEach(c =>
      c.classList.remove("hint", "invalid"));
  }

  function getAnchorCellFromPoint(x, y) {
    // Ghost has its top-left offset by the shape; figure out anchor cell under pointer.
    // Ghost transform translates by (-50%, -110%), so pointer is near bottom-center.
    const rect = el.board.getBoundingClientRect();
    const sz = cellSize();
    // compute ghost top-left in viewport
    const gw = drag.piece.g[0].length * sz + (drag.piece.g[0].length - 1) * 3;
    const gh = drag.piece.g.length * sz + (drag.piece.g.length - 1) * 3;
    const ghostLeft = x - gw / 2;
    const ghostTop = y - gh - sz * 0.1;
    // anchor cell = first cell top-left
    const col = Math.round((ghostLeft - rect.left - 4) / (sz + 3));
    const row = Math.round((ghostTop - rect.top - 4) / (sz + 3));
    return { row, col };
  }

  function updateHint(x, y) {
    clearHints();
    const { row, col } = getAnchorCellFromPoint(x, y);
    if (row == null) return;
    const ok = canPlace(drag.piece, row, col);
    const cells = getPieceCells(drag.piece, row, col);
    for (const [r, c] of cells) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      const cEl = el.board.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (cEl) cEl.classList.add(ok ? "hint" : "invalid");
    }
  }

  function getPieceCells(p, r0, c0) {
    const out = [];
    for (let rr = 0; rr < p.g.length; rr++) {
      for (let cc = 0; cc < p.g[0].length; cc++) {
        if (p.g[rr][cc]) out.push([r0 + rr, c0 + cc]);
      }
    }
    return out;
  }

  function canPlace(p, r0, c0) {
    for (const [r, c] of getPieceCells(p, r0, c0)) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      if (state.board[r][c]) return false;
    }
    return true;
  }

  function place(p, r0, c0) {
    for (const [r, c] of getPieceCells(p, r0, c0)) {
      state.board[r][c] = { a: p.a };
    }
    const gained = getPieceCells(p, r0, c0).length;
    state.score += gained;
  }

  document.addEventListener("pointerup", (e) => {
    if (!drag) return;
    const { row, col } = getAnchorCellFromPoint(e.clientX, e.clientY);
    const p = drag.piece;
    if (canPlace(p, row, col)) {
      place(p, row, col);
      state.tray[drag.idx] = null;
      endDrag();
      renderBoard();
      renderTray();
      resolveClearsAndCascade();
    } else {
      endDrag();
    }
  });

  function endDrag() {
    if (!drag) return;
    drag.slotEl.classList.remove("picked");
    clearHints();
    el.ghost.classList.remove("active");
    drag = null;
  }

  function resolveClearsAndCascade() {
    let chain = 0;
    const step = () => {
      const { rows, cols } = findFullLines();
      if (rows.length === 0 && cols.length === 0) {
        afterCascade();
        return;
      }
      chain++;
      const clearedCells = [];
      for (const r of rows) for (let c = 0; c < COLS; c++) clearedCells.push([r,c]);
      for (const c of cols) for (let r = 0; r < ROWS; r++) clearedCells.push([r,c]);
      const unique = new Set(clearedCells.map(([r,c]) => `${r},${c}`));

      // Rescue check
      let rescuedThis = 0;
      for (const k of unique) {
        if (state.cages.has(k)) {
          state.cages.delete(k);
          rescuedThis++;
        }
      }
      if (rescuedThis > 0) {
        state.rescued += rescuedThis;
      }

      // Animate
      unique.forEach(k => {
        const [r,c] = k.split(",").map(Number);
        const cEl = el.board.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
        if (cEl) cEl.classList.add("clearing");
      });

      // Score + combo
      const lineCount = rows.length + cols.length;
      const base = unique.size * 10;
      const multiplier = chain + Math.max(0, lineCount - 1);
      state.score += base * multiplier;

      if (lineCount > 1 || chain > 1) {
        showCombo(chain > 1 ? `x${chain + 1} ZİNCİR!` : "ÇİFTE!");
      }

      setTimeout(() => {
        unique.forEach(k => {
          const [r,c] = k.split(",").map(Number);
          state.board[r][c] = null;
        });
        renderBoard();
        updateHUD();
        // Add new cage occasionally
        if (Math.random() < 0.35) spawnCage();
        // Continue cascade (no gravity in block-blast style — but re-check in case future variants add it)
        setTimeout(step, 120);
      }, 280);
    };
    step();
  }

  function afterCascade() {
    updateHUD();
    if (state.tray.every(x => !x)) fillTray();
    if (checkGameOver()) showGameOver();
    else if (rescuedAnimalToShow()) {
      // rescue celebration
    }
  }

  function rescuedAnimalToShow() { return false; }

  function spawnCage() {
    const emptyCells = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (!state.board[r][c] && !state.cages.has(`${r},${c}`))
          emptyCells.push([r,c]);
    if (emptyCells.length === 0) return;
    const [r,c] = emptyCells[Math.floor(Math.random()*emptyCells.length)];
    state.cages.add(`${r},${c}`);
    const cEl = el.board.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if (cEl) cEl.classList.add("cage");
  }

  function findFullLines() {
    const rows = [];
    const cols = [];
    for (let r = 0; r < ROWS; r++) {
      if (state.board[r].every(v => v)) rows.push(r);
    }
    for (let c = 0; c < COLS; c++) {
      let full = true;
      for (let r = 0; r < ROWS; r++) if (!state.board[r][c]) { full = false; break; }
      if (full) cols.push(c);
    }
    return { rows, cols };
  }

  function showCombo(text) {
    el.combo.textContent = text;
    el.combo.classList.add("show");
    setTimeout(() => el.combo.classList.remove("show"), 700);
  }

  function updateHUD() {
    el.score.textContent = state.score;
    el.rescued.textContent = state.rescued;
    el.reroll.textContent = `🐱 Reroll (${state.reroll})`;
  }

  function checkGameOver() {
    const pieces = state.tray.filter(Boolean);
    if (pieces.length === 0) return false;
    for (const p of pieces) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (canPlace(p, r, c)) return false;
        }
      }
    }
    return true;
  }

  function showGameOver() {
    state.gameOver = true;
    el.modalAnimal.textContent = "😿";
    el.modalTitle.textContent = "Oyun Bitti";
    el.modalText.textContent = `Puan: ${state.score} — Kurtarılan: ${state.rescued}`;
    el.modalBtn.textContent = "Tekrar Oyna";
    el.modal.classList.add("show");
  }

  el.modalBtn.addEventListener("click", () => {
    el.modal.classList.remove("show");
    newGame();
  });

  el.newGame.addEventListener("click", newGame);

  el.reroll.addEventListener("click", () => {
    if (state.reroll <= 0 || state.gameOver) return;
    state.reroll--;
    state.tray = [null, null, null];
    fillTray();
    updateHUD();
    if (checkGameOver()) showGameOver();
  });

  function newGame() {
    state.score = 0;
    state.rescued = 0;
    state.reroll = 3;
    state.gameOver = false;
    state.tray = [null, null, null];
    initBoard();
    fillTray();
    updateHUD();
  }

  // prevent page scroll during drag
  document.addEventListener("touchmove", (e) => {
    if (drag) e.preventDefault();
  }, { passive: false });

  newGame();
})();
</script>
</body>
</html>
