<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1830">
<title>LastPeg — Zen Peg Solitaire</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at top, #1A2A4A 0%, #0A1220 70%, #05070D 100%);
    color: #E8F4FF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    max-width: 540px; margin: 0 auto;
  }

  /* Starfield background */
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 65% 70%, rgba(200,215,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 40% 85%, rgba(180,200,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 90% 45%, rgba(200,220,255,0.35), transparent),
      radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 25% 75%, rgba(220,230,255,0.3), transparent);
    pointer-events: none;
    opacity: 0.7;
  }

  /* Moonbeam */
  .moonbeam {
    position: absolute;
    top: -10%; right: -10%;
    width: 80%; height: 140%;
    background: radial-gradient(ellipse at top right, rgba(200,215,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  /* HUD */
  #hud {
    position: relative;
    padding: 16px 20px 8px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  #hud .title {
    font-family: "Cinzel", Georgia, serif;
    font-size: 14px; letter-spacing: 3px;
    color: #D4B87A;
    font-weight: 400;
  }
  #hud .level {
    font-size: 12px;
    color: #C0C8D4;
    letter-spacing: 1.5px;
  }
  #hud .undo {
    background: rgba(200,215,255,0.08);
    border: 1px solid rgba(212,184,122,0.3);
    color: #D4B87A;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #hud .undo:hover:not(:disabled) { background: rgba(212,184,122,0.15); }
  #hud .undo:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Board */
  #boardWrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 20px;
  }
  #board {
    position: relative;
    display: grid;
    gap: 2px;
    padding: 24px;
    border-radius: 24px;
    background:
      linear-gradient(135deg, rgba(26,42,74,0.95) 0%, rgba(10,18,32,0.95) 100%);
    box-shadow:
      0 0 0 1px rgba(192,200,212,0.15),
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }
  /* Marble vein overlay */
  #board::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 24px;
    background-image:
      linear-gradient(110deg, transparent 40%, rgba(192,200,212,0.04) 42%, transparent 44%),
      linear-gradient(70deg, transparent 55%, rgba(192,200,212,0.03) 57%, transparent 59%);
    pointer-events: none;
  }

  .cell {
    width: 11vw; height: 11vw;
    max-width: 48px; max-height: 48px;
    min-width: 28px; min-height: 28px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .cell.wall { visibility: hidden; }
  .cell.hole {
    border-radius: 50%;
    background: radial-gradient(circle at 50% 55%, rgba(0,0,0,0.4), rgba(0,0,0,0.15));
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.05);
  }

  /* Orb */
  .orb {
    width: 78%; height: 78%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(255,255,255,0.95) 0%,
      rgba(232,244,255,0.75) 20%,
      rgba(140,180,230,0.45) 55%,
      rgba(60,100,160,0.25) 85%);
    box-shadow:
      0 0 12px rgba(180,210,255,0.4),
      0 0 24px rgba(120,160,220,0.2),
      inset 0 2px 3px rgba(255,255,255,0.6),
      inset 0 -3px 6px rgba(30,60,120,0.3);
    cursor: pointer;
    transition: transform 0.18s ease-out;
    position: relative;
  }
  .orb::after {
    content: "";
    position: absolute;
    top: 12%; left: 18%;
    width: 28%; height: 22%;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    filter: blur(1px);
  }
  .orb.selected {
    transform: scale(1.12);
    box-shadow:
      0 0 20px rgba(212,184,122,0.8),
      0 0 40px rgba(212,184,122,0.4),
      inset 0 2px 3px rgba(255,255,255,0.7),
      inset 0 -3px 6px rgba(80,60,20,0.3);
  }
  .cell.target-hint {
    animation: targetPulse 1.2s ease-in-out infinite;
  }
  .cell.target-hint::before {
    content: "";
    position: absolute;
    width: 60%; height: 60%;
    border-radius: 50%;
    border: 2px solid rgba(212,184,122,0.7);
    animation: ringPulse 1.2s ease-out infinite;
  }
  @keyframes targetPulse {
    0%, 100% { background: radial-gradient(circle, rgba(212,184,122,0.15), rgba(0,0,0,0.15)); }
    50% { background: radial-gradient(circle, rgba(212,184,122,0.35), rgba(0,0,0,0.15)); }
  }
  @keyframes ringPulse {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .orb.jumping {
    animation: arcJump 0.35s ease-out;
  }
  @keyframes arcJump {
    0% { transform: scale(1); }
    50% { transform: scale(1.15) translateY(-6px); }
    100% { transform: scale(1); }
  }

  .orb.vanishing {
    animation: vanish 0.4s ease-out forwards;
  }
  @keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.8; filter: blur(1px); }
    100% { transform: scale(0); opacity: 0; }
  }

  /* Bottom status */
  #status {
    padding: 12px 24px 32px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #8A95AC;
    position: relative; z-index: 10;
  }
  #status .pegs-left {
    color: #D4B87A;
    font-size: 14px;
  }
  #status .dots {
    margin-top: 8px;
    display: flex; gap: 8px; justify-content: center;
  }
  #status .dots .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(192,200,212,0.25);
    transition: background 0.3s;
  }
  #status .dots .dot.active { background: #D4B87A; }

  /* Win overlay */
  #winOverlay {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(26,42,74,0.85) 0%, rgba(5,7,13,0.95) 80%);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  #winOverlay.show { display: flex; animation: fadeIn 0.6s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #winOverlay h1 {
    font-family: "Cinzel", Georgia, serif;
    font-weight: 400;
    font-size: 28px;
    letter-spacing: 6px;
    color: #D4B87A;
    margin: 0 0 12px;
  }
  #winOverlay .sub {
    font-size: 13px;
    letter-spacing: 2px;
    color: #C0C8D4;
    margin-bottom: 40px;
  }
  #winOverlay .crystal {
    width: 60px; height: 60px;
    margin-bottom: 32px;
    background: radial-gradient(circle at 35% 30%,
      #FFFFFF 0%, #E8F4FF 25%, #8AB2E6 60%, #3C6CA5 100%);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(180,210,255,0.6), 0 0 60px rgba(212,184,122,0.3);
    animation: crystalFloat 2s ease-in-out infinite;
  }
  @keyframes crystalFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }
  #winOverlay button {
    background: transparent;
    border: 1px solid #D4B87A;
    color: #D4B87A;
    padding: 12px 32px;
    font-size: 12px;
    letter-spacing: 3px;
    border-radius: 24px;
    cursor: pointer;
    margin: 4px;
    transition: all 0.25s;
  }
  #winOverlay button:hover {
    background: rgba(212,184,122,0.15);
    transform: translateY(-1px);
  }

  /* Fail state */
  #failHint {
    position: absolute; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(26,42,74,0.9);
    border: 1px solid rgba(212,184,122,0.3);
    color: #E8F4FF;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 1.5px;
    display: none;
  }
  #failHint.show {
    display: block;
    animation: fadeIn 0.4s ease-out;
  }
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div>
  <div class="moonbeam"></div>

  <div id="hud">
    <div>
      <div class="title">LASTPEG</div>
      <div class="level" id="levelLabel">Moonlight — Level 1</div>
    </div>
    <button class="undo" id="undoBtn" disabled>↶ UNDO</button>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="failHint">No moves left. Tap ↶ UNDO.</div>
  </div>

  <div id="status">
    <div><span id="pegsLeft" class="pegs-left">—</span> PEGS REMAIN</div>
    <div class="dots" id="levelDots"></div>
  </div>

  <div id="winOverlay">
    <div class="crystal"></div>
    <h1 id="winTitle">COMPLETE</h1>
    <div class="sub" id="winSub">A crystal joins your garden</div>
    <div>
      <button id="nextBtn">NEXT LEVEL</button>
      <button id="replayBtn">REPLAY</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ========= Level Definitions =========
   'P' = peg, 'O' = empty hole, '.' = wall/absent
   Each level is a 2D array.
   Center marked by solutions is implicit; "perfect clear" = last peg at centerMark.
================================== */
const LEVELS = [
  {
    name: "First Light",
    centerMark: [2, 2],
    board: [
      [".", "P", "P", "P", "."],
      ["P", "P", "P", "P", "P"],
      ["P", "P", "O", "P", "P"],
      ["P", "P", "P", "P", "P"],
      [".", "P", "P", "P", "."],
    ],
  },
  {
    name: "Small Cross",
    centerMark: [3, 3],
    board: [
      [".", ".", "P", "P", "P", ".", "."],
      [".", ".", "P", "P", "P", ".", "."],
      ["P", "P", "P", "P", "P", "P", "P"],
      ["P", "P", "P", "O", "P", "P", "P"],
      ["P", "P", "P", "P", "P", "P", "P"],
      [".", ".", "P", "P", "P", ".", "."],
      [".", ".", "P", "P", "P", ".", "."],
    ],
  },
  {
    name: "Diamond",
    centerMark: [3, 3],
    board: [
      [".", ".", ".", "P", ".", ".", "."],
      [".", ".", "P", "P", "P", ".", "."],
      [".", "P", "P", "P", "P", "P", "."],
      ["P", "P", "P", "O", "P", "P", "P"],
      [".", "P", "P", "P", "P", "P", "."],
      [".", ".", "P", "P", "P", ".", "."],
      [".", ".", ".", "P", ".", ".", "."],
    ],
  },
  {
    name: "Plus Moon",
    centerMark: [2, 2],
    board: [
      [".", "P", "P", "P", "."],
      ["P", "P", "P", "P", "P"],
      ["P", "P", "O", "P", "P"],
      ["P", "P", "P", "P", "P"],
      [".", "P", "P", "P", "."],
    ],
  },
  {
    name: "The Garden",
    centerMark: [3, 3],
    board: [
      [".", ".", "P", "P", "P", ".", "."],
      [".", "P", "P", "P", "P", "P", "."],
      ["P", "P", "P", "P", "P", "P", "P"],
      ["P", "P", "P", "O", "P", "P", "P"],
      ["P", "P", "P", "P", "P", "P", "P"],
      [".", "P", "P", "P", "P", "P", "."],
      [".", ".", "P", "P", "P", ".", "."],
    ],
  },
];

/* ========= Core Game State ========= */
const state = {
  levelIndex: 0,
  grid: [],          // 'P' | 'O' | '.'
  rows: 0, cols: 0,
  centerMark: [0, 0],
  selected: null,    // [r, c]
  history: [],       // stack of grid snapshots
};

/* ========= DOM ========= */
const boardEl = document.getElementById("board");
const levelLabel = document.getElementById("levelLabel");
const pegsLeftEl = document.getElementById("pegsLeft");
const levelDotsEl = document.getElementById("levelDots");
const undoBtn = document.getElementById("undoBtn");
const winOverlay = document.getElementById("winOverlay");
const winTitle = document.getElementById("winTitle");
const winSub = document.getElementById("winSub");
const nextBtn = document.getElementById("nextBtn");
const replayBtn = document.getElementById("replayBtn");
const failHint = document.getElementById("failHint");

/* ========= Core Logic ========= */
function loadLevel(idx) {
  const lvl = LEVELS[idx];
  state.levelIndex = idx;
  state.grid = lvl.board.map(row => row.slice());
  state.rows = state.grid.length;
  state.cols = state.grid[0].length;
  state.centerMark = lvl.centerMark;
  state.selected = null;
  state.history = [];
  levelLabel.textContent = `Moonlight — ${lvl.name}`;
  renderBoard();
  renderDots();
  hideWin();
  failHint.classList.remove("show");
}

function snapshot() {
  state.history.push(state.grid.map(r => r.slice()));
  undoBtn.disabled = state.history.length === 0;
}

function undo() {
  if (!state.history.length) return;
  state.grid = state.history.pop();
  state.selected = null;
  renderBoard();
  undoBtn.disabled = state.history.length === 0;
  failHint.classList.remove("show");
}

function inBounds(r, c) {
  return r >= 0 && r < state.rows && c >= 0 && c < state.cols;
}

function validJumpsFrom(r, c) {
  if (state.grid[r][c] !== "P") return [];
  const dirs = [[-2, 0], [2, 0], [0, -2], [0, 2]];
  const results = [];
  for (const [dr, dc] of dirs) {
    const tr = r + dr, tc = c + dc;
    const mr = r + dr / 2, mc = c + dc / 2;
    if (!inBounds(tr, tc)) continue;
    if (state.grid[tr][tc] !== "O") continue;
    if (state.grid[mr][mc] !== "P") continue;
    results.push([tr, tc]);
  }
  return results;
}

function anyMovesAvailable() {
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (state.grid[r][c] === "P" && validJumpsFrom(r, c).length > 0) return true;
    }
  }
  return false;
}

function countPegs() {
  let n = 0;
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++)
      if (state.grid[r][c] === "P") n++;
  return n;
}

function attemptJump(fromR, fromC, toR, toC) {
  const mr = (fromR + toR) / 2, mc = (fromC + toC) / 2;
  snapshot();
  state.grid[fromR][fromC] = "O";
  state.grid[mr][mc] = "O";
  state.grid[toR][toC] = "P";
  state.selected = null;

  // Animation: vanish the middle peg, arc the jumper
  const middleCell = cellEl(mr, mc);
  const movedCell = cellEl(toR, toC);
  if (middleCell && middleCell.firstChild) {
    middleCell.firstChild.classList.add("vanishing");
  }
  renderBoardDelayed(120);

  setTimeout(() => {
    const jumper = cellEl(toR, toC)?.firstChild;
    if (jumper) jumper.classList.add("jumping");
    setTimeout(() => jumper?.classList.remove("jumping"), 360);
    afterMove();
  }, 260);
}

function afterMove() {
  const pegs = countPegs();
  pegsLeftEl.textContent = pegs;
  if (pegs === 1) {
    const [r, c] = state.centerMark;
    const perfect = state.grid[r][c] === "P";
    showWin(perfect);
  } else if (!anyMovesAvailable()) {
    failHint.classList.add("show");
  }
}

/* ========= Rendering ========= */
function cellEl(r, c) {
  return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function renderBoard() {
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
  const selectedTargets = state.selected
    ? validJumpsFrom(state.selected[0], state.selected[1])
    : [];
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const v = state.grid[r][c];
      const cell = document.createElement("div");
      cell.className = "cell" + (v === "." ? " wall" : " hole");
      cell.dataset.r = r;
      cell.dataset.c = c;
      const isTarget = selectedTargets.some(([tr, tc]) => tr === r && tc === c);
      if (isTarget) cell.classList.add("target-hint");

      if (v === "P") {
        const orb = document.createElement("div");
        orb.className = "orb";
        if (state.selected && state.selected[0] === r && state.selected[1] === c) {
          orb.classList.add("selected");
        }
        cell.appendChild(orb);
      }

      cell.addEventListener("click", onCellClick);
      boardEl.appendChild(cell);
    }
  }
  pegsLeftEl.textContent = countPegs();
}

function renderBoardDelayed(ms) {
  setTimeout(renderBoard, ms);
}

function renderDots() {
  levelDotsEl.innerHTML = "";
  for (let i = 0; i < LEVELS.length; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === state.levelIndex ? " active" : "");
    levelDotsEl.appendChild(d);
  }
}

function onCellClick(e) {
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  const v = state.grid[r][c];

  if (state.selected) {
    const [sr, sc] = state.selected;
    if (sr === r && sc === c) {
      state.selected = null;
      renderBoard();
      return;
    }
    const targets = validJumpsFrom(sr, sc);
    const hit = targets.find(([tr, tc]) => tr === r && tc === c);
    if (hit) {
      attemptJump(sr, sc, r, c);
      return;
    }
  }
  if (v === "P") {
    state.selected = [r, c];
    renderBoard();
  }
}

/* ========= Win ========= */
function showWin(perfect) {
  winTitle.textContent = perfect ? "PERFECT CLEAR" : "COMPLETE";
  winSub.textContent = perfect
    ? "A rare crystal lands in the center"
    : "A crystal joins your garden";
  winOverlay.classList.add("show");
}
function hideWin() {
  winOverlay.classList.remove("show");
}

/* ========= Events ========= */
undoBtn.addEventListener("click", undo);
nextBtn.addEventListener("click", () => {
  loadLevel((state.levelIndex + 1) % LEVELS.length);
});
replayBtn.addEventListener("click", () => loadLevel(state.levelIndex));

/* Boot */
loadLevel(0);
</script>
</body>
</html>
